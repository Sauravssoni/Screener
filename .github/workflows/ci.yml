name: RedrobRank CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate committed submission shape
        run: python validate_submission.py submissions/submission.csv

      - name: Lint Python
        run: ruff check .

      - name: Run tests
        run: PYTHONPATH=. pytest -q

      - name: Bandit security scan
        run: bandit -r src rank.py sandbox_app.py scripts -ll

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: NPM audit
        run: npm audit --audit-level=high
